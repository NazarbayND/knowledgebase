name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Build and validate navigation and links
        run: python -m mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch
    needs: [build, python-examples]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  python-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python-backend-engineering
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: examples/python-backend-engineering/uv.lock
      - name: Install locked example dependencies
        run: uv sync --frozen
      - name: Check lint and formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Check source types
        run: uv run --frozen mypy
      - name: Run behavioral and integration tests
        run: uv run --frozen pytest
      - name: Build distributable package
        run: uv build --wheel
      - name: Run example entry points
        run: |
          uv run --frozen python -m fulfillhub
          uv run --frozen python -m fulfillhub.runtime_lab
          uv run --frozen python -m fulfillhub.concurrency_lab
          uv run --frozen python -m fulfillhub.concurrency_lab --executors
