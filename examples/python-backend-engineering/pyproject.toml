[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fulfillhub-learning"
version = "0.1.0"
description = "Executable Phase 1 and Phase 2 learning examples, not a production service"
requires-python = ">=3.14,<3.15"
dependencies = ["httpx>=0.28.1,<0.29"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "mypy>=1.18,<2", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fulfillhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
